set -g mouse on
set-option -g history-limit 10000

bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind c new-window -c "#{pane_current_path}"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Command hotkeys
bind k kill-session

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Copy mode - JAVÍTOTT RÉSZ SSH TÁMOGATÁSHOZ
# OSC 52 támogatás SSH-n keresztül
set -g set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# Copy mode beállítások
bind m copy-mode
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle

# Platform-specifikus másolás
# Ha SSH-n vagy, használja az OSC 52-t, különben próbálja a wl-copy-t
if-shell 'test -n "$SSH_CLIENT"' {
    # SSH session - OSC 52 használata
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'cat'
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'cat'
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'cat'
} {
    # Helyi session - használj wl-copy-t ha elérhető, különben xclip
    if-shell 'command -v wl-copy' {
        bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
        bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
    } {
        if-shell 'command -v xclip' {
            bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'
            bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'
            bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'
        } {
            # Fallback - csak másolás tmux buffer-be
            bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
            bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
            bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
        }
    }
}

# Alternatív megoldás: mindig OSC 52 használata (egyszerűbb)
# Kommenteld ki a fenti if-shell blokkot és használd ezt:
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin "nordtheme/tmux"

set -g @nova-rows 0

run '~/.tmux/plugins/tpm/tpm'
